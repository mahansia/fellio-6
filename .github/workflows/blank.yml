name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Find project folder
        run: |
          F=$(find . -name settings.gradle.kts | head -1)
          [ -z "$F" ] && { echo "settings.gradle.kts not found"; ls -R | head -50; exit 1; }
          echo "PROJ_DIR=$(dirname "$F")" >> "$GITHUB_ENV"
      - name: Build
        working-directory: ${{ env.PROJ_DIR }}
        run: |
          set +e
          gradle :app:assembleDebug :app:assembleRelease --no-daemon --console=plain > build.log 2>&1
          CODE=$?
          if [ $CODE -ne 0 ]; then
            echo "=========== ERRORS ==========="
            grep -nE "^e: |error:|What went wrong|Execution failed" build.log | head -60
            echo "=========== LAST 40 LINES ==========="
            tail -40 build.log
          fi
          exit $CODE
      - uses: actions/upload-artifact@v4
        with:
          name: Parde-apk
          path: ${{ env.PROJ_DIR }}/app/build/outputs/apk/**/*.apk
